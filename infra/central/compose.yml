configs:
  botPolicy:
    content: |
      bots:
        - name: well-known
          path_regex: ^/.well-known/.*$
          action: ALLOW
        - name: favicon
          path_regex: ^/favicon.ico$
          action: ALLOW
        - name: robots-txt
          path_regex: ^/robots.txt$
          action: ALLOW
        - name: generic-browser
          user_agent_regex: Mozilla
          action: CHALLENGE
  nginx:
    content: |
      events {
          worker_connections   2000;

          use epoll;
      }

      http {
        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          '' close;
        }
        map $$upstream_http_location $$location_oauth_compatible {
          ~(.*)(%3A8080)(.*) $$1%3A4000$$3;
          default "";
        }

        server {
          listen 4000;

          location / {
            proxy_pass         http://anubis:5050; 
            proxy_set_header   Host $$host;
            proxy_set_header   X-Real-IP $$remote_addr;
            proxy_set_header   X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $$scheme;
          }
        }

        server {
          listen 4040;
          
          location / {
            proxy_set_header Host localhost:3000;
            proxy_pass http://host.docker.internal:3000;

            # Hot-reloading            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
          }
          
          location /api/ {
            proxy_set_header Host localhost:4000;
            proxy_pass http://host.docker.internal:8080/api/;

            add_header X-Powered-By 'ktor <https://github.com/ktorio/ktor>';
          }
        }
      }

services:
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    environment:
      BIND: ":5050"
      DIFFICULTY: "5"
      SERVE_ROBOTS_TXT: "true"
      TARGET: "http://nginx:4040"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms
    ports:
      - 5050:5050
    configs:
      - source: botPolicy
        target: /data/cfg/botPolicy.yaml
        uid: "65534" #: numeric UID for 'nobody' user
        gid: "65534" #: numeric GID for 'nobody' group
        mode: 0400
  web:
    container_name: nginx
    image: nginx
    configs:
      - source: nginx
        target: /etc/nginx/nginx.conf
        uid: "65534" #: numeric UID for 'nobody' user
        gid: "65534" #: numeric GID for 'nobody' group
        mode: 0400
    ports:
      - "4000:4000"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=4000

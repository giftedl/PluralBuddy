# The 'curb' is the extra resources that PluralBuddy could need, for autodeploying, etc.

configs:
  prometheus_config:
    content: |
      scrape_configs:
        - job_name: 'pluralbuddy'
          scrape_interval: 5s
          static_configs:
            - targets: ['100.115.240.88:3030']

name: pluralbuddy-curb
version: "3"
services:

  ### Observability tools
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    ports:
      - 12345:12345
    command: "run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy"
    volumes:
      - ${PWD}/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    networks:
      - loki

  tempo:
    image: "grafana/tempo:3.0.0"
    command: "-target=all -config.file=/etc/tempo.yaml"
    container_name: tempo
    restart: unless-stopped
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # tempo
      - "4318:4318"

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    ports:
      - 3100:3100
    volumes:
      - ${PWD}:/mnt/config
    command: "-config.file=\"/mnt/config/loki-config.yaml\""
    networks:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        uid: "65534"    # Required: numeric UID for 'nobody' user
        gid: "65534"    # Required: numeric GID for 'nobody' group
        mode: 0400      # Required: read-only permissions
    expose:
      - "9090"
    volumes:
      - prometheus-data:/prometheus



  ### Grafana
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_PATHS_CONFIG=/var/lib/grafana/grafana.ini
    ports:
      - '3000:80'
    volumes:
      - grafana-storage:/var/lib/grafana


networks:
  loki: {}

volumes:
  tempo-data: {}
  prometheus-data: {}
  grafana-storage: {}

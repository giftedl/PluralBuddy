ktor:
  deployment:
    port: 8080
  central:
    ktorEncryption: "$KTOR_ENCRYPTION"
    clientUrl: "http://localhost:3000"
  oidc:
    pluralbuddy:
      issuer: "https://pluralbuddy.app/api/auth"
      clientId: "$CLIENT_ID"
      clientSecret: "$CLIENT_SECRET"
      scopes: ["openid", "profile", "system:admin", "offline_access"]
  application:
    modules:
      - app.pluralbuddy.services.HttpUtilitiesKt.configureHttp
      - app.pluralbuddy.services.SerializationKt.configureSerialization
      - app.pluralbuddy.services.WebsocketsKt.configureWebsockets
      - app.pluralbuddy.services.StatusCodesKt.configureStatusPages
      - app.pluralbuddy.services.MongoDBKt.configureMongo
      - app.pluralbuddy.services.AuthenticationRoutingKt.configureAuthenticationSecurity
